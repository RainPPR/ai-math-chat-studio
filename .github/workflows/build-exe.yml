name: Build Windows EXE

on:
  push:
    branches:
      - desktop

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun scripts/build-bundle.mjs
      - name: Build Electron app
        run: bunx electron-builder --win --config electron-builder.yml --publish=never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: release/*.exe

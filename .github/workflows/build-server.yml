name: Build Server Bundle

on:
  push:
    branches:
      - desktop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: node scripts/build-bundle.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: server-bundle
          path: dist-server/

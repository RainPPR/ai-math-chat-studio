name: Build Server Bundle

on:
  push:
    branches:
      - desktop
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun scripts/build-bundle.ts

      - uses: actions/upload-artifact@v4
        with:
          name: server-bundle
          path: dist-server/

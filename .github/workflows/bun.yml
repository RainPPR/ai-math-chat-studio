name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run lint --max-warnings=0
        if: always()
      - run: bun run check --max-warnings=0
        if: always()
      - run: bun run pretty --max-warnings=0
        if: always()

  build-bundle:
    runs-on: ubuntu-latest
    needs: check-lint
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build:bundle
      - uses: actions/upload-artifact@v7
        with:
          name: server-bundle
          path: dist-server/

  build-compile:
    runs-on: windows-latest
    needs: check-lint
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build:compile
      - uses: actions/upload-artifact@v7
        with:
          name: bun-compile-windows
          path: release/*.exe

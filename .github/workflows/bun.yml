name: Build

on:
  push:
    branches:
      - desktop
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build:bundle
      - uses: actions/upload-artifact@v7
        with:
          name: server-bundle
          path: dist-server/

  build-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run build:compile
      - uses: actions/upload-artifact@v7
        with:
          name: bun-compile-windows
          path: release/*.exe

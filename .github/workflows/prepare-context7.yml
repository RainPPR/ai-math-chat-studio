name: Prepare Context7

on:
  push:
    branches:
      - desktop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-context7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Run preparation script
        run: bun scripts/prepare-context7.ts

      - name: Deploy to context7 branch
        run: |
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          
          # Clone the context7 branch into a separate directory
          git clone --branch context7 $REPO_URL context7_repo || (git clone $REPO_URL context7_repo && cd context7_repo && git checkout --orphan context7 && git rm -rf .)
          
          # Remove old content and copy new artifacts
          # Ensure we don't remove the .git directory
          find context7_repo -maxdepth 1 ! -name "context7_repo" ! -name ".git" -exec rm -rf {} +
          cp -r context7-dist/* context7_repo/
          
          cd context7_repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: deploy context7 artifacts ($(date -u +'%Y-%m-%d %H:%M:%S UTC'))"
            git push origin context7
          else
            echo "No changes to commit"
          fi

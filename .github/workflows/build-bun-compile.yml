name: Build with Bun Compile

on:
  push:
    branches:
      - desktop
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - run: bun scripts/build-bun-compile.ts

      - uses: actions/upload-artifact@v4
        with:
          name: bun-compile-windows
          path: release/*.exe
